<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>消防即時災情監控看板</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body, html {
            width: 100%;
            height: 100%;
            font-family: "Microsoft JhengHei", sans-serif;
            overflow: hidden;
            background-color: #333;
        }
        .container {
            display: flex;
            width: 100%;
            height: calc(100% - 40px);
        }
        .window-box {
            flex: 1;
            height: 100%;
            display: flex;
            flex-direction: column;
            border: 2px solid #444;
        }
        .window-title {
            background-color: #222;
            color: #fff;
            padding: 8px 12px;
            font-size: 14px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
        }
        iframe {
            width: 100%;
            flex: 1;
            border: none;
            background-color: #fff;
        }
        .status-bar {
            height: 40px;
            background-color: #1a1a1a;
            color: #eceff1;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            font-size: 14px;
        }
        .countdown-text {
            color: #ff5252;
            font-weight: bold;
        }
        .btn-refresh {
            background-color: #d32f2f;
            color: white;
            border: none;
            padding: 4px 10px;
            cursor: pointer;
            border-radius: 3px;
            font-size: 12px;
        }
        .btn-refresh:hover {
            background-color: #f44336;
        }
    </style>
</head>
<body>

    <div class="status-bar">
        <div>🚨 消防即時災情雙視窗監控</div>
        <div>自動刷新倒數：<span id="countdown" class="countdown-text">30</span> 秒</div>
        <button class="btn-refresh" onclick="refreshWindows()">手動強制刷新</button>
    </div>

    <div class="container">
        <!-- 左視窗：臺中 -->
        <div class="window-box">
            <div class="window-title">
                <span>[臺中市] 即時災情</span>
            </div>
            <iframe id="frame-taichung" src="https://www.fire.taichung.gov.tw/caselist/index.asp?Parser=99,8,226"></iframe>
        </div>
        
        <!-- 右視窗：苗栗 -->
        <div class="window-box">
            <div class="window-title">
                <span>[苗栗縣] 即時災情</span>
            </div>
            <iframe id="frame-miaoli" src="https://119mlfire.mlfd.gov.tw/DTS/caselist/html"></iframe>
        </div>
    </div>

    <script>
        const REFRESH_INTERVAL_SECS = 30;
        let timeLeft = REFRESH_INTERVAL_SECS;

        function refreshWindows() {
            // 線上環境最佳化：使用重載主頁面方式重新整理，可完全避開傳統伺服器的快取死結與跨網域衝突
            window.location.reload();
        }

        setInterval(function() {
            timeLeft--;
            document.getElementById('countdown').textContent = timeLeft;
            
            if (timeLeft <= 0) {
                refreshWindows();
            }
        }, 1000);
    </script>
</body>
</html>
