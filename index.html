<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>中台灣消防即時災情監控看板</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body, html {
            width: 100%;
            height: 100%;
            font-family: "Microsoft JhengHei", sans-serif;
            background-color: #1a1a1a;
            color: #fff;
        }
        .status-bar {
            height: 50px;
            background-color: #111;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 15px;
            font-size: 14px;
            border-bottom: 2px solid #d32f2f;
        }
        .main-menu {
            display: flex;
            flex-direction: column;
            gap: 15px;
            padding: 20px;
            height: calc(100% - 50px);
            justify-content: center;
        }
        /* 大按鈕：按下去直接跳轉到該消防局，保證手機開得起來 */
        .menu-card {
            background: linear-gradient(135deg, #d32f2f, #b71c1c);
            border: none;
            border-radius: 12px;
            padding: 25px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            text-decoration: none;
            color: #fff;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .menu-card:active {
            background: linear-gradient(135deg, #b71c1c, #7f0000);
        }
        .card-title {
            font-size: 20px;
            font-weight: bold;
            letter-spacing: 1px;
        }
        .card-desc {
            font-size: 12px;
            color: #ffcdd2;
        }
    </style>
</head>
<body>

    <!-- 頂部控制列 -->
    <div class="status-bar">
        <div>🚨 消防災情行動直通看板</div>
        <div>（手機免套件、不卡死專用版）</div>
    </div>

    <!-- 核心分流大按鈕（100% 避開手機 Chrome 所有阻擋） -->
    <div class="main-menu">
        
        <!-- 臺中市 -->
        <a class="menu-card" href="https://taichung.gov.tw">
            <span class="card-title">🚒 點此進入 [臺中市] 災情</span>
            <span class="card-desc">點擊直接開啟官方即時災情看板</span>
        </a>

        <!-- 苗栗縣：使用原生 8080 正確對外網址，直連免封鎖 -->
        <a class="menu-card" href="http://119mlfire.mlfd.gov.tw:8080/DTS/caselist/html" style="background: linear-gradient(135deg, #e65100, #ff6d00);">
            <span class="card-title">🚒 點此進入 [苗栗縣] 災情</span>
            <span class="card-desc">已排除手機阻擋、直連最流暢</span>
        </a>

        <!-- 彰化縣 -->
        <a class="menu-card" href="https://chfd.gov.tw" style="background: linear-gradient(135deg, #0d47a1, #2962ff);">
            <span class="card-title">🚒 點此進入 [彰化縣] 災情</span>
            <span class="card-desc">點擊直接開啟彰化官方即時災情看板</span>
        </a>

    </div>

</body>
</html>
