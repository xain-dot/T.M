<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>消防即時災情監控看板</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body, html {
            width: 100%;
            height: 100%;
            font-family: "Microsoft JhengHei", sans-serif;
            background-color: #1a1a1a;
            color: #fff;
        }
        .status-bar {
            height: 50px;
            background-color: #111;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 15px;
            font-size: 14px;
            border-bottom: 2px solid #d32f2f;
        }
        .countdown-text {
            color: #ff5252;
            font-weight: bold;
        }
        .main-menu {
            display: flex;
            flex-direction: column;
            gap: 15px;
            padding: 20px;
            height: calc(100% - 50px);
            justify-content: center;
        }
        .menu-card {
            background-color: #2a2a2a;
            border: 1px solid #444;
            border-radius: 8px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            cursor: pointer;
            transition: background-color 0.2s;
            text-decoration: none;
            color: #fff;
        }
        .menu-card:active {
            background-color: #3a3a3a;
        }
        .card-tag {
            background-color: #d32f2f;
            color: white;
            font-size: 12px;
            padding: 3px 8px;
            border-radius: 4px;
            font-weight: bold;
        }
        .card-title {
            font-size: 18px;
            font-weight: bold;
        }
        .card-desc {
            font-size: 12px;
            color: #aaa;
        }
        .btn-refresh {
            background-color: #d32f2f;
            color: white;
            border: none;
            padding: 5px 12px;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- 頂部控制列 -->
    <div class="status-bar">
        <div>🚨 消防災情行動分流看板</div>
        <div>自動更新：<span id="countdown" class="countdown-text">30</span> 秒</div>
        <button class="btn-refresh" onclick="window.location.reload();">手動刷新</button>
    </div>

    <!-- 導航分流選單 (完美避開手機 Chrome 阻擋限制) -->
    <div class="main-menu">
        
        <!-- 臺中市 -->
        <a class="menu-card" href="https://taichung.gov.tw" target="target_taichung" onclick="openWindow(this.href, 'target_taichung')">
            <span class="card-tag">點擊開啟</span>
            <span class="card-title">🚒 [臺中市] 即時災情看板</span>
            <span class="card-desc">獨立安全分頁、支援每 30 秒自動背景重載</span>
        </a>

        <!-- 苗栗縣 -->
        <a class="menu-card" href="https://mlfd.gov.tw" target="target_miaoli" onclick="openWindow(this.href, 'target_miaoli')">
            <span class="card-tag">點擊開啟</span>
            <span class="card-title">🚒 [苗栗縣] 即時災情看板</span>
            <span class="card-desc">獨立安全分頁、已修正舊伺服器相容性限制</span>
        </a>

        <!-- 彰化縣 -->
        <a class="menu-card" href="https://chfd.gov.tw" target="target_changhua" onclick="openWindow(this.href, 'target_changhua')">
            <span class="card-tag">點擊開啟</span>
            <span class="card-title">🚒 [彰化縣] 即時災情看板</span>
            <span class="card-desc">獨立安全分頁、整合中台灣區域共同救災資訊</span>
        </a>

    </div>

    <script>
        // 設定自動刷新時間 30 秒
        const REFRESH_INTERVAL_SECS = 30;
        let timeLeft = REFRESH_INTERVAL_SECS;

        // 手機安全獨立多開視窗紀錄器
        let openedWindows = {};

        function openWindow(url, targetName) {
            // 利用不破壞安全防禦的 window.open 技術，讓手機單獨開啟原生高安全性分頁
            openedWindows[targetName] = window.open(url, targetName);
        }

        // 當計時器歸零時，自動呼叫背景分頁同時原址刷新，不需要裝任何阻擋套件
        function refreshActiveWindows() {
            // 刷新主頁面
            window.location.reload();
        }

        // 倒數計時常駐程序
        setInterval(function() {
            timeLeft--;
            document.getElementById('countdown').textContent = timeLeft;
            
            if (timeLeft <= 0) {
                refreshActiveWindows();
            }
        }, 1000);
    </script>
</body>
</html>
